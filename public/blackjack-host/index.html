<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Host</title>
    <style>
        :root {
            --bg: #0a1f14;
            --panel: #0f2b1c;
            --line: #1e4d33;
            --text: #f1f5f2;
            --muted: #9fb3a6;
            --accent: #d4af37;
            --accent-text: #1a1206;
            --good: #34d399;
            --warn: #f59e0b;
            --danger: #f87171;
            --gold: #fbbf24;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: linear-gradient(180deg, #123420 0%, var(--bg) 70%);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 18px;
            overflow: hidden;
        }

        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 36px);
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px;
        }

        .sidebar-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow-y: auto;
        }

        .main-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        h1, h2 { margin: 0; font-weight: 700; }
        h1 { font-size: 1.35rem; }
        h2 { font-size: 1rem; margin-bottom: 10px; }

        .muted { color: var(--muted); }

        .join-url {
            margin-top: 10px;
            font-weight: 700;
            color: var(--accent);
            word-break: break-all;
        }

        .join-qr {
            margin-top: 10px;
            width: 132px;
            padding: 8px;
            background: #fff;
            border-radius: 8px;
            line-height: 0;
        }

        .join-qr svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-weight: 700;
            cursor: pointer;
            background: var(--accent);
            color: var(--accent-text);
        }

        button[disabled] { opacity: 0.45; cursor: not-allowed; }
        .secondary { background: #475569; color: #f8fafc; }
        .danger-btn { background: #7f1d1d; color: #fecaca; }

        .row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--line);
            padding: 8px 0;
            font-size: 0.94rem;
        }

        .row:first-child { border-top: none; padding-top: 0; }

        .felt {
            border: 2px solid #14532d;
            border-radius: 120px / 60px;
            background: radial-gradient(ellipse at center, #1a6b3c 0%, #0f4c2a 70%, #0b3a20 100%);
            padding: 20px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .dealer-section {
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px;
        }

        .felt #players-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .felt .player-row {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.28);
            flex: 1 1 220px;
            max-width: 260px;
            margin-bottom: 0;
        }

        .felt .player-row.current {
            background: rgba(52, 211, 153, 0.22);
        }

        .section-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .cards-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 69px;
            align-items: center;
        }

        .mini-card {
            width: 51px;
            height: 69px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(2,6,23,.35);
        }

        .mini-card.red { color: #b91c1c; }
        .mini-card .rank { font-size: 2.04rem; line-height: 1; }
        .mini-card .suit { font-size: 2.3rem; line-height: 1; align-self: center; transform: translateY(-5px); }
        .mini-card.hidden { background: #1e3a5f; border-color: #2d4a7a; color: #4a7abf; display: flex; align-items: center; justify-content: center; }
        .mini-card.hidden .rank { font-size: 2.5rem; line-height: 1; }

        .dealer-val {
            margin-top: 6px;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .player-row {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #081a11;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .player-row.current {
            border-color: rgba(52,211,153,.5);
            background: rgba(52,211,153,.06);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .player-name { font-weight: 700; font-size: 0.95rem; }
        .player-chips { color: var(--good); font-weight: 700; font-size: 0.88rem; }

        .player-info {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .pill {
            display: inline-block;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .pill-playing   { background: #1e40af; color: #bfdbfe; }
        .pill-standing  { background: #374151; color: #9ca3af; }
        .pill-bust      { background: #7f1d1d; color: #fecaca; }
        .pill-blackjack { background: #78350f; color: #fde68a; }
        .pill-sitting   { background: #1f2937; color: #6b7280; }
        .pill-current   { background: rgba(52,211,153,.2); color: #6ee7b7; border: 1px solid rgba(52,211,153,.4); }

        .result-pill { font-size: 0.85rem; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
        .result-win      { background: #14532d; color: #86efac; }
        .result-blackjack{ background: #78350f; color: #fde68a; }
        .result-push     { background: #374151; color: #d1d5db; }
        .result-lose     { background: #450a0a; color: #fca5a5; }
        .result-bust     { background: #450a0a; color: #fca5a5; }

        .hand-val { font-size: 0.85rem; color: var(--muted); }
        .hand-val.over { color: var(--danger); }
        .hand-val.bj   { color: var(--gold); }

        .bet-tag {
            font-size: 0.75rem;
            color: var(--gold);
        }

        #toasts {
            position: fixed; right: 16px; bottom: 16px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1000; pointer-events: none;
        }

        .toast {
            min-width: 180px; max-width: 320px;
            padding: 10px 14px; border-radius: 10px;
            background: #10291b; border: 1px solid var(--line);
            color: var(--text); font-weight: 700; font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(0,0,0,.45);
            opacity: 0; transform: translateY(6px);
            transition: opacity 220ms ease, transform 220ms ease;
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        .phase-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            background: #243665;
            color: #bfdbfe;
        }

        @media (max-width: 900px) {
            html, body { height: auto; }
            body { overflow: visible; }
            .grid { grid-template-columns: 1fr; height: auto; }
            .sidebar-card { overflow-y: visible; }
            .main-card { min-height: 500px; }
            .felt { flex: none; }
        }
    </style>
</head>
<body>
    <div class="grid">
        <section class="card sidebar-card">
            <h1>Blackjack Host</h1>
            <div class="muted">Fixed bet: 100 chips / round</div>
            <div class="join-url" id="join-url">Join URL loading...</div>
            <div class="join-qr" id="join-qr"></div>
            <div class="controls">
                <button id="btn-start">Start Game</button>
                <button id="btn-next" class="secondary" disabled>Next Round</button>
                <button id="btn-restart" class="secondary danger-btn" disabled>Restart</button>
            </div>

            <h2 style="margin-top:18px;">Lobby <span id="lobby-count" class="phase-badge">0</span></h2>
            <div id="lobby-list" class="muted">No players in lobby</div>

            <h2 style="margin-top:18px;">Queue <span id="queue-count" class="phase-badge">0</span></h2>
            <div id="queue-list" class="muted">Queue is empty</div>
        </section>

        <section class="card main-card">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                <h2 style="margin:0;">Table</h2>
                <span id="phase-badge" class="phase-badge">Waiting</span>
            </div>

            <div class="felt">
                <div class="dealer-section">
                    <div class="section-title">Dealer</div>
                    <div class="cards-strip" id="dealer-cards">
                        <span class="muted">No cards yet</span>
                    </div>
                    <div class="dealer-val" id="dealer-val"></div>
                </div>

                <div id="players-area">
                    <div class="muted">No active game</div>
                </div>
            </div>
        </section>
    </div>

    <div id="toasts"></div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        const socket = io();

        const joinUrlEl  = document.getElementById('join-url');
        const joinQrEl   = document.getElementById('join-qr');
        const btnStart   = document.getElementById('btn-start');
        const btnNext    = document.getElementById('btn-next');
        const btnRestart = document.getElementById('btn-restart');
        const lobbyList  = document.getElementById('lobby-list');
        const lobbyCount = document.getElementById('lobby-count');
        const queueList  = document.getElementById('queue-list');
        const queueCount = document.getElementById('queue-count');
        const phaseBadge = document.getElementById('phase-badge');
        const dealerCardsEl = document.getElementById('dealer-cards');
        const dealerValEl   = document.getElementById('dealer-val');
        const playersArea   = document.getElementById('players-area');
        const toastsEl      = document.getElementById('toasts');

        let gameActive = false;
        let roundOver  = false;

        function esc(v) {
            const d = document.createElement('div');
            d.textContent = String(v);
            return d.innerHTML;
        }

        function fmt(n) { return Number(n || 0).toLocaleString(); }

        function cardMarkup(card) {
            if (!card) return '';
            if (card.rank === '?') {
                return '<div class="mini-card hidden"><span class="rank">?</span></div>';
            }
            const isRed = card.suit === '♥' || card.suit === '♦';
            return `<div class="mini-card${isRed ? ' red' : ''}"><span class="rank">${esc(card.rank)}</span><span class="suit">${esc(card.suit)}</span></div>`;
        }

        function statusPill(status, isCurrent) {
            if (isCurrent) return '<span class="pill pill-current">TURN</span>';
            const map = {
                playing: 'pill-playing', standing: 'pill-standing',
                bust: 'pill-bust', blackjack: 'pill-blackjack', sitting_out: 'pill-sitting',
            };
            const cls = map[status] || 'pill-sitting';
            return `<span class="pill ${cls}">${esc((status || '').toUpperCase().replace('_', ' '))}</span>`;
        }

        function resultPill(result) {
            if (!result) return '';
            const map = {
                win: 'result-win', blackjack: 'result-blackjack',
                push: 'result-push', lose: 'result-lose', bust: 'result-bust',
            };
            const labels = { win: 'WIN +100', blackjack: 'BLACKJACK +150', push: 'TIE', lose: 'LOSE', bust: 'BUST' };
            const cls = map[result] || 'result-push';
            return `<span class="result-pill ${cls}">${esc(labels[result] || result.toUpperCase())}</span>`;
        }

        function updateButtons() {
            btnStart.disabled   = gameActive;
            btnNext.disabled    = !gameActive || !roundOver;
            btnRestart.disabled = !gameActive;
        }

        function showToast(msg, color) {
            const div = document.createElement('div');
            div.className = 'toast';
            div.textContent = msg;
            if (color) div.style.borderColor = color;
            toastsEl.appendChild(div);
            requestAnimationFrame(() => div.classList.add('show'));
            while (toastsEl.children.length > 5) toastsEl.removeChild(toastsEl.firstChild);
            setTimeout(() => { div.classList.remove('show'); setTimeout(() => div.remove(), 260); }, 3500);
        }

        function renderJoinQr(url) {
            if (typeof qrcode === 'undefined') return;
            const qr = qrcode(0, 'M');
            qr.addData(url);
            qr.make();
            joinQrEl.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        }

        function setJoinUrl(host, port) {
            const url = `${location.protocol}//${host}:${port}/blackjack-join`;
            joinUrlEl.textContent = url;
            renderJoinQr(url);
        }

        socket.on('connect', () => {
            fetch('/api/network-info')
                .then((r) => r.json())
                .then((info) => {
                    setJoinUrl(info.host || location.hostname, info.port || location.port);
                })
                .catch(() => {
                    setJoinUrl(location.hostname, location.port);
                });
            socket.emit('bj_host_connected');
        });

        socket.on('bj_lobby_update', (players) => {
            lobbyCount.textContent = String(players.length);
            if (!players.length) {
                lobbyList.innerHTML = '<div class="muted">No players in lobby</div>';
            } else {
                lobbyList.innerHTML = players.map((p) =>
                    `<div class="row"><span>${esc(p.nickname)}</span><span style="color:var(--good)">${fmt(p.chips)}</span></div>`
                ).join('');
            }
            if (!gameActive) btnStart.disabled = players.length < 1;
        });

        socket.on('bj_queue_update', (players) => {
            queueCount.textContent = String(players.length);
            if (!players.length) {
                queueList.innerHTML = '<div class="muted">Queue is empty</div>';
            } else {
                queueList.innerHTML = players.map((p) =>
                    `<div class="row"><span>${esc(p.nickname)}</span><span style="color:var(--warn)">${fmt(p.chips)}</span></div>`
                ).join('');
            }
        });

        socket.on('bj_round_starting', () => {
            gameActive = true;
            roundOver = false;
            phaseBadge.textContent = 'In Progress';
            updateButtons();
        });

        socket.on('bj_game_state', (state) => {
            const PHASE_LABELS = {
                round_over: 'Round Over',
                player_turns: 'Player Turns',
                dealer_turn: 'Dealer Playing',
            };
            phaseBadge.textContent = PHASE_LABELS[state.state] || state.state;

            // Dealer
            const dc = state.dealer_cards || [];
            if (!dc.length) {
                dealerCardsEl.innerHTML = '<span class="muted">No cards yet</span>';
                dealerValEl.textContent = '';
            } else {
                dealerCardsEl.innerHTML = dc.map(cardMarkup).join('');
                dealerValEl.textContent = `Value: ${state.dealer_value}${state.state === 'round_over' && state.dealer_value > 21 ? ' - BUST' : ''}`;
            }

            // Players
            const players = state.players || [];
            if (!players.length) {
                playersArea.innerHTML = '<div class="muted">No active players</div>';
                return;
            }
            playersArea.innerHTML = players.map((p) => {
                const cards   = p.cards || [];
                const cardsHtml = cards.length
                    ? `<div class="cards-strip" style="margin-top:6px">${cards.map(cardMarkup).join('')}</div>`
                    : '';
                const valHtml = cards.length
                    ? `<span class="hand-val${p.hand_value > 21 ? ' over' : p.status === 'blackjack' ? ' bj' : ''}">${p.hand_value}</span>`
                    : '';
                const betTag  = p.bet > 0 ? `<span class="bet-tag">bet ${fmt(p.bet)}${p.doubled ? ' (2x)' : ''}</span>` : '';
                return `
                <div class="player-row${p.is_current ? ' current' : ''}">
                    <div class="player-header">
                        <span class="player-name">${esc(p.nickname)}</span>
                        <span class="player-chips">${fmt(p.chips)} chips</span>
                    </div>
                    <div class="player-info">
                        ${statusPill(p.status, p.is_current)}
                        ${valHtml}
                        ${betTag}
                        ${resultPill(p.result)}
                        ${p.is_connected === false ? '<span class="pill pill-sitting">OFFLINE</span>' : ''}
                    </div>
                    ${cardsHtml}
                </div>`;
            }).join('');
        });

        socket.on('bj_round_over', (data) => {
            roundOver = true;
            updateButtons();
            const RESULT_LABELS = { win: 'win', blackjack: 'blackjack', push: 'tie', lose: 'lose', bust: 'bust' };
            const results = data.results || {};
            const parts = Object.entries(results).map(([name, res]) => `${name}: ${RESULT_LABELS[res] || res}`);
            showToast('Round over! ' + (parts.join(' · ') || ''), '#34d399');
        });

        socket.on('bj_game_finished', (data) => {
            gameActive = false;
            roundOver = false;
            phaseBadge.textContent = 'Finished';
            dealerCardsEl.innerHTML = '<span class="muted">No cards yet</span>';
            dealerValEl.textContent = '';
            playersArea.innerHTML = '<div class="muted">No active game</div>';
            updateButtons();
            showToast(data.message || 'Game finished.', '#60a5fa');
        });

        socket.on('bj_start_error', (data) => {
            alert((data && data.message) || 'Cannot start.');
        });

        btnStart.addEventListener('click', () => socket.emit('bj_start_round'));
        btnNext.addEventListener('click', () => socket.emit('bj_next_round'));
        btnRestart.addEventListener('click', () => {
            if (!confirm('Restart? All chips reset to 1000.')) return;
            socket.emit('bj_restart_game');
        });
    </script>
</body>
</html>
