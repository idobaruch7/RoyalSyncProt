<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoyalTest Prototype</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .panel {
            width: min(720px, 100%);
            background: var(--panel);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
        }

        .actions {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        a {
            text-decoration: none;
            color: #0f172a;
            font-weight: 700;
            text-align: center;
            border-radius: var(--radius);
            padding: 16px;
        }

        .host { background: var(--accent); }
        .join { background: var(--accent-2); }

        .note {
            margin-top: 16px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        @media (max-width: 640px) {
            .actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>RoyalTest Prototype</h1>
        <p>Dumbed-down standalone build with no persisted player names.</p>
        <div class="actions">
            <a class="host" href="/host">Open Host</a>
            <a class="join" href="/join">Open Player</a>
        </div>
        <div class="note">Runs independently from the main app.</div>
    </main>
</body>
</html>
