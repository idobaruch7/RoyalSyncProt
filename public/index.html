<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoyalTest Prototype</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #22c55e;
            --accent-2: #38bdf8;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .panel {
            width: min(720px, 100%);
            background: var(--panel);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
        }

        p {
            margin: 10px 0 0;
            color: var(--muted);
        }

        h2 {
            margin: 0 0 10px;
            font-size: 1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .games {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .game-section {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: var(--radius);
            padding: 16px;
        }

        .game-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        a {
            text-decoration: none;
            color: #0f172a;
            font-weight: 700;
            text-align: center;
            border-radius: 8px;
            padding: 12px 8px;
            font-size: 0.9rem;
        }

        .host { background: var(--accent); }
        .join { background: var(--accent-2); }

        @media (max-width: 640px) {
            .games { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main class="panel">
        <h1>RoyalSync Prototype</h1>
        <p>Standalone build — no persistence, no auth.</p>
        <div class="games">
            <div class="game-section">
                <h2>Texas Hold'em</h2>
                <div class="game-actions">
                    <a class="host" href="/host">Host</a>
                    <a class="join" href="/join">Join</a>
                </div>
            </div>
            <div class="game-section">
                <h2>Blackjack</h2>
                <div class="game-actions">
                    <a class="host" href="/blackjack-host">Host</a>
                    <a class="join" href="/blackjack-join">Join</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
