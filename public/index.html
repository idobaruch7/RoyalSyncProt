<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoyalSync</title>
    <style>
      :root {
        --bg: #0b1f14;
        --panel: #0f2b1c;
        --felt: #124a2a;
        --text: #f1f5f2;
        --muted: #9fb3a6;
        --gold: #d4af37;
        --gold-light: #f1d989;
        --accent-2: #38bdf8;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background: radial-gradient(
          circle at top,
          var(--felt) 0%,
          var(--bg) 60%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .panel {
        width: min(720px, 100%);
        background: var(--panel);
        border: 1px solid var(--gold);
        border-radius: 16px;
        padding: 32px;
        box-shadow:
          0 0 0 1px rgba(212, 175, 55, 0.15),
          0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .brand {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
      }

      .brand .suit {
        font-size: clamp(2.4rem, 8vw, 3.4rem);
        color: var(--gold);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 3.4rem);
        color: var(--gold-light);
        letter-spacing: 0.02em;
      }

      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-family: Arial, sans-serif;
        text-align: center;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        color: var(--gold-light);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-family: Arial, sans-serif;
      }

      .games {
        margin-top: 28px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .game-section {
        background: var(--felt);
        border: 1px solid #1e6b3f;
        border-radius: var(--radius);
        padding: 18px;
      }

      .game-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      a {
        text-decoration: none;
        color: #0b1f14;
        font-weight: 700;
        text-align: center;
        border-radius: 8px;
        padding: 12px 8px;
        font-size: 1.1rem;
        font-family: Arial, sans-serif;
      }

      .host {
        background: var(--gold);
      }
      .join {
        background: var(--accent-2);
      }

      @media (max-width: 640px) {
        .games {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <span class="suit">♠</span>
        <h1>RoyalSync</h1>
        <span class="suit">♥</span>
      </div>
      <p>Pick a table and take a seat.</p>
      <div class="games">
        <div class="game-section">
          <h2>Texas Hold'em</h2>
          <div class="game-actions">
            <a class="host" href="/host">Host</a>
            <a class="join" href="/join">Join</a>
          </div>
        </div>
        <div class="game-section">
          <h2>Blackjack</h2>
          <div class="game-actions">
            <a class="host" href="/blackjack-host">Host</a>
            <a class="join" href="/blackjack-join">Join</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
